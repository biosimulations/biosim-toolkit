[project]
name = "biosim-toolkit"
version = "0.1.0"
description = "Trusted utilities for process-bigraph simulations: SED-ML adapters, reports, data manipulation, visualization"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# bigraph-schema is a direct requirement: process-bigraph's discovery scans only distributions that require it, and
# registers each Edge class as local:<module>.<Class>.
dependencies = [
    "bigraph-schema>=1.0.14",
    "process-bigraph>=1.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pbsim-common==0.1.2",  # the generic COPASI and Tellurium steps, for the end-to-end tests
    "copasi-basico",
    "python-copasi",
    "tellurium>=2.2.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biosim_toolkit"]

[tool.ruff]
line-length = 120
