name: main
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      # process-bigraph discovers classes through installed distributions' metadata, which an editable install hides
      - run: uv pip install --reinstall --no-deps .
      - run: uvx ruff check . && uvx ruff format --check .
      - run: uv run --no-sync pytest -q
